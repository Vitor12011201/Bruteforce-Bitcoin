name: Reference validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run reference test suite
        run: python -m unittest discover -v
      - name: Compile Python sources
        run: python -m compileall -q main.py bip39_lab tests scripts
      - name: Check browser JavaScript syntax
        run: node --check bip39_lab/static/app.js
